name: Daily prompts sync

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: prompts-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, validate, normalize
        run: python3 pipeline/sync.py

      - name: Commit prompts.json if content changed
        run: |
          if [ "$(python3 -c 'import json; print(json.load(open("pipeline/_run/status.json"))["changed"])')" != "True" ]; then
            echo "No content change; nothing to commit."
            exit 0
          fi
          cp pipeline/_run/prompts.json prompts.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompts.json
          git commit -F pipeline/_run/commit_message.txt
          git push

      - name: Run summary
        if: always()
        run: cat pipeline/_run/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily sync failed"
          {
            cat pipeline/_run/summary.md 2>/dev/null || echo "Sync failed before a summary was written."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file /tmp/issue.md
          else
            gh issue create --title "$title" --body-file /tmp/issue.md
          fi
