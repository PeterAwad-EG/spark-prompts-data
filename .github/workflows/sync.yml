name: Daily prompts sync

on:
  schedule:
    # GitHub cron is always UTC. 00:15 UTC = 03:15 Cairo in summer (UTC+3), 02:15 in winter (UTC+2).
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: prompts-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, validate, normalize
        run: python3 pipeline/sync.py

      - name: Commit on content change, or heartbeat after 30 quiet days
        run: |
          changed=$(python3 -c 'import json; print(json.load(open("pipeline/_run/status.json"))["changed"])')
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp pipeline/_run/status_public.json status.json
          if [ "$changed" = "True" ]; then
            cp pipeline/_run/prompts.json prompts.json
            git add prompts.json status.json
            git commit -F pipeline/_run/commit_message.txt
          elif [ "$age_days" -ge 30 ]; then
            echo "No content change, but last commit is $age_days days old: committing heartbeat."
            git add status.json
            git commit -F pipeline/_run/heartbeat_message.txt
          else
            echo "No content change; last commit $age_days days old; nothing to commit."
            exit 0
          fi
          git push

      - name: Run summary
        if: always()
        run: cat pipeline/_run/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily sync failed"
          {
            cat pipeline/_run/summary.md 2>/dev/null || echo "Sync failed before a summary was written."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file /tmp/issue.md
          else
            gh issue create --title "$title" --body-file /tmp/issue.md
          fi
